name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (Nuitka)
        shell: cmd
        run: build_nuitka.bat

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/main.dist/* -DestinationPath StockVideoAutomator-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockVideoAutomator-Windows
          path: StockVideoAutomator-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (Nuitka)
        run: ./build_nuitka.sh

      - name: Package
        run: |
          cd build
          zip -r ../StockVideoAutomator-macOS.zip main.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockVideoAutomator-macOS
          path: StockVideoAutomator-macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            artifacts/StockVideoAutomator-Windows/StockVideoAutomator-Windows.zip \
            artifacts/StockVideoAutomator-macOS/StockVideoAutomator-macOS.zip \
            --clobber
